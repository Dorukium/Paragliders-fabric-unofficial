plugins {
    id 'fabric-loom' version '1.17.21'
    id 'java-library'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

// Minecraft 26.2 is no longer obfuscated and ships no Mojang mappings, so Loom runs
// in no-remap mode (see fabric.loom.disableObfuscation in gradle.properties).
// In this mode modImplementation is unavailable and Fabric mods are plain dependencies.
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/paraglider.accesswidener")
}

sourceSets.main.resources.srcDir "src/generated/resources"

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    from("LICENSE") {
        into "META-INF"
        rename { "PARAGLIDER-LICENSE-GPL-3.0.txt" }
    }
    from("TEMPLATE_LICENSE.txt") {
        into "META-INF"
    }
    from("NOTICE.md") {
        into "META-INF"
        rename { "PARAGLIDER-PORT-NOTICE.md" }
    }
}

tasks.named("sourcesJar").configure {
    from("LICENSE")
    from("TEMPLATE_LICENSE.txt")
    from("NOTICE.md")
}
